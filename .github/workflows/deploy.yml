name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.0)'
        required: true
        type: string
      force:
        description: 'Force upgrade'
        required: false
        type: boolean
        default: false

# 单一部署队列：同一时刻只跑一次部署流程，避免多个 tag 触发的运行并发强制推送 deploy 分支。
# cancel-in-progress: false —— 已开始的部署会跑完（保留已开始的部署），后续运行排队；
# 排队时只有最新一次会被保留（GitHub 的并发组行为），最终 deploy 分支始终是最新版本。
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  # ── Tag preparation (runs once) ─────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      clean-tag: ${{ steps.tag-prep.outputs.clean-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 所有 ${{ }} 值经 env 传入, 不直接插到 run 脚本里 (避免 tag/输入内容被当 shell 执行)
      - name: Validate version format
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$INPUT_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format: $INPUT_VERSION (expected vX.Y.Z)"
            exit 1
          fi

      - name: Prepare deploy tag and force marker
        id: tag-prep
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$EVENT_NAME" = "push" ]; then
            TAG_NAME="$REF_NAME"
            if ! printf '%s' "$TAG_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-force)?$'; then
              echo "Refusing to deploy unexpected tag: $TAG_NAME"
              exit 1
            fi
            if printf '%s' "$TAG_NAME" | grep -q '\-force$'; then
              IS_FORCE=true
              CLEAN_TAG=$(printf '%s' "$TAG_NAME" | sed 's/-force$//')
            else
              IS_FORCE=false
              CLEAN_TAG="$TAG_NAME"
            fi
          else
            CLEAN_TAG="$INPUT_VERSION"
            IS_FORCE="$INPUT_FORCE"
            git tag -a "$CLEAN_TAG" -m "$CLEAN_TAG"
            git push origin "$CLEAN_TAG"
          fi

          if [ "$IS_FORCE" = "true" ]; then
            CURRENT=$(git tag -l 'force-*' | sed -n 's/^force-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
            CURRENT=${CURRENT:-0}
            NEXT=$((CURRENT + 1))
            git tag "force-${NEXT}"
            git push origin "force-${NEXT}"
            echo "Created force marker: force-${NEXT}"
          fi

          echo "clean-tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT

  # ── Build & Deploy────
  build-deploy:
    name: Build & Deploy
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # public/game-i18n 是 cmyyx/cep-assets 子模块 (公开仓)：不拉下来 out/game-i18n 会缺内容
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          DEPLOY_TAG: ${{ needs.prepare.outputs.clean-tag }}
          SEO_INDEXABLE: 'true'
          # ── 站点配置──
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_OAUTH_CLIENT_NAMES: ${{ vars.OAUTH_CLIENT_NAMES }}
          NEXT_PUBLIC_ALLOWED_DOMAINS: ${{ vars.ALLOWED_DOMAINS }}
          NEXT_PUBLIC_ALLOWED_EMBED_DOMAINS: ${{ vars.ALLOWED_EMBED_DOMAINS }}
          NEXT_PUBLIC_FORUM_URL: ${{ vars.FORUM_URL }}
          # ── Sentry (browser-only SDK; DSN is public, inlined at build time) ──
          NEXT_PUBLIC_SENTRY_DSN: https://30b0e7412127b8c00b66f7b9ee2bc217@o4511814100844544.ingest.us.sentry.io/4511814110543872
          # postbuild uploads source maps via sentry-cli; only the auth token
          # is secret. org/project are hard-coded in scripts/upload-sourcemaps.mjs.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy to deploy branch
        env:
          DEPLOY_LABEL: ${{ github.ref_name || inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 保存构建产物到临时目录
          cp -r out $RUNNER_TEMP/out
          git checkout --orphan deploy-temp
          # 清空工作目录
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          # 站点根放到 public/，配合托管平台 Root directory=public
          mkdir -p public
          cp -r $RUNNER_TEMP/out/* public/
          # wrangler.jsonc 需在 deploy 分支根（与 public/ 同级），CF Workers 从该目录部署；
          # 移出站点根，避免部署配置随站点公开可读
          mv public/wrangler.jsonc ./wrangler.jsonc
          # public/game-i18n 是 cmyyx/cep-assets 子模块，产物必须以普通文件落进 deploy 分支：
          # 1) .git 指针残留时，git add 会把整个目录登记成 gitlink (mode 160000)；
          # 2) deploy 分支没有 .gitmodules，托管平台检出后目录为空，线上 /game-i18n/* 全部 404 (v1.6.2 即如此)。
          # 构建阶段 prune-export 已剥离 .git，这里再来一次兜底。
          rm -rf public/game-i18n/.git
          if [ ! -f public/game-i18n/manifest.json ]; then
            echo "::error::public/game-i18n 内容缺失 (子模块未初始化?)，线上 /game-i18n/* 会 404"
            exit 1
          fi
          # 索引里已存在 source 树的 gitlink 条目时，git add 不会进入该路径把它替换成文件，
          # 必须先剔除条目再 add (实测：只删 .git 不够)。
          git rm -r --cached -f --ignore-unmatch public/game-i18n >/dev/null
          git add -A
          if git ls-files --stage public/game-i18n | grep -q '^160000'; then
            echo "::error::public/game-i18n 仍被子模块指针登记 (mode 160000)，线上 /game-i18n/* 会 404"
            exit 1
          fi
          if ! git ls-files --error-unmatch public/game-i18n/manifest.json >/dev/null 2>&1; then
            echo "::error::public/game-i18n/manifest.json 未入库"
            exit 1
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s $GITHUB_SHA)
          git commit -m "deploy: ${DEPLOY_LABEL} - ${COMMIT_MSG}"
          git push origin "deploy-temp:deploy" --force
