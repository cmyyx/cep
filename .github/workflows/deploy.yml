name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.0)'
        required: true
        type: string
      force:
        description: 'Force upgrade'
        required: false
        type: boolean
        default: false

jobs:
  # ── Tag preparation (runs once, before matrix) ──────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      clean-tag: ${{ steps.tag-prep.outputs.clean-tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 所有 ${{ }} 值经 env 传入, 不直接插到 run 脚本里 (避免 tag/输入内容被当 shell 执行)
      - name: Validate version format
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$INPUT_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format: $INPUT_VERSION (expected vX.Y.Z)"
            exit 1
          fi

      - name: Prepare deploy tag and force marker
        id: tag-prep
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$EVENT_NAME" = "push" ]; then
            TAG_NAME="$REF_NAME"
            if ! printf '%s' "$TAG_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-force)?$'; then
              echo "Refusing to deploy unexpected tag: $TAG_NAME"
              exit 1
            fi
            if printf '%s' "$TAG_NAME" | grep -q '\-force$'; then
              IS_FORCE=true
              CLEAN_TAG=$(printf '%s' "$TAG_NAME" | sed 's/-force$//')
            else
              IS_FORCE=false
              CLEAN_TAG="$TAG_NAME"
            fi
          else
            CLEAN_TAG="$INPUT_VERSION"
            IS_FORCE="$INPUT_FORCE"
            git tag -a "$CLEAN_TAG" -m "$CLEAN_TAG"
            git push origin "$CLEAN_TAG"
          fi

          if [ "$IS_FORCE" = "true" ]; then
            CURRENT=$(git tag -l 'force-*' | sed -n 's/^force-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
            CURRENT=${CURRENT:-0}
            NEXT=$((CURRENT + 1))
            git tag "force-${NEXT}"
            git push origin "force-${NEXT}"
            echo "Created force marker: force-${NEXT}"
          fi

          echo "clean-tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT

  # ── Build & Deploy (matrix: intl + cn) ──────────────────
  build-deploy:
    name: Build & Deploy (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - intl
          - cn
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          DEPLOY_TAG: ${{ needs.prepare.outputs.clean-tag }}
          SEO_INDEXABLE: 'true'
          # ── 双版本共享 ──
          NEXT_PUBLIC_ALLOWED_DOMAINS: ${{ vars.ALLOWED_DOMAINS }}
          NEXT_PUBLIC_ALLOWED_EMBED_DOMAINS: ${{ vars.ALLOWED_EMBED_DOMAINS }}
          NEXT_PUBLIC_FORUM_URL: ${{ vars.FORUM_URL }}
          # ── Sentry (browser-only SDK; DSN is public, inlined at build time) ──
          NEXT_PUBLIC_SENTRY_DSN: https://30b0e7412127b8c00b66f7b9ee2bc217@o4511814100844544.ingest.us.sentry.io/4511814110543872
          # postbuild uploads source maps via sentry-cli; only the auth token
          # is secret. org/project are hard-coded in scripts/upload-sourcemaps.mjs.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # ── 仅 intl 版本 ──
          NEXT_PUBLIC_API_BASE_URL: ${{ matrix.target == 'intl' && vars.API_BASE_URL || '' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ matrix.target == 'intl' && secrets.TURNSTILE_SITE_KEY || '' }}
          NEXT_PUBLIC_OAUTH_CLIENT_NAMES: ${{ matrix.target == 'intl' && vars.OAUTH_CLIENT_NAMES || '' }}

      - name: Deploy to deploy branch
        env:
          DEPLOY_LABEL: ${{ github.ref_name || inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 保存构建产物到临时目录
          cp -r out $RUNNER_TEMP/out
          git checkout --orphan deploy-temp
          # 清空工作目录
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          # 站点根放到 public/，配合托管平台 Root directory=public
          mkdir -p public
          cp -r $RUNNER_TEMP/out/* public/
          # wrangler.jsonc 需在 deploy 分支根（与 public/ 同级），CF Workers 从该目录部署；
          # 移出站点根，避免部署配置随站点公开可读
          mv public/wrangler.jsonc ./wrangler.jsonc
          git add -A
          COMMIT_MSG=$(git log -1 --pretty=%s $GITHUB_SHA)
          git commit -m "deploy: ${DEPLOY_LABEL} [${TARGET}] - ${COMMIT_MSG}"
          git push origin "deploy-temp:deploy-${TARGET}" --force
