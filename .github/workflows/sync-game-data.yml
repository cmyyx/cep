name: Sync Game Data
on:
  schedule:
    - cron: '0 0 * * 4,5'  # every Thursday and Friday at 00:00 UTC
  workflow_dispatch:      # manual trigger
    inputs:
      force_sync:
        description: 'Skip the upstream-change gate and run the sync unconditionally'
        type: boolean
        default: false

jobs:
  check:
    # force_sync (manual dispatch) means the operator already decided a sync must run,
    # so the entire gate is skipped — including the upstream clones and chromium install.
    if: ${{ inputs.force_sync != true }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The check phase probes the Skland wiki (not part of the upstream SHAs) so a
      # new preview character/avatar triggers a sync without a manual dispatch.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate AKEData access token
        env:
          GH_TOKEN: ${{ secrets.GH_FORK_SYNC_TOKEN }}
        run: |
          RESULT=$(gh api /repos/cmyyx/AKEData --jq .private 2>/dev/null) || true
          if [ "$RESULT" != "true" ]; then
            echo "::error::Cannot access private AKEData fork. GH_FORK_SYNC_TOKEN may be invalid or expired. Sync pipeline cannot verify upstream data integrity."
            exit 1
          fi

      - name: Sync AKEData fork from upstream
        env:
          GH_TOKEN: ${{ secrets.GH_FORK_SYNC_TOKEN }}
        run: |
          gh api --method POST /repos/cmyyx/AKEData/merge-upstream \
            -f branch='main'

      - name: Clone upstream repos (outside working tree)
        env:
          GH_FORK_SYNC_TOKEN: ${{ secrets.GH_FORK_SYNC_TOKEN }}
        run: |
          UPSTREAM_DIR="$RUNNER_TEMP/upstream"
          mkdir -p "$UPSTREAM_DIR"

          # Clone AKEData fork (synced from upstream above)
          git clone --depth 1 --filter=blob:none --sparse --no-checkout \
            "https://oauth2:${GH_FORK_SYNC_TOKEN}@github.com/cmyyx/AKEData.git" "$UPSTREAM_DIR/AKEData"
          git -C "$UPSTREAM_DIR/AKEData" sparse-checkout init --cone
          git -C "$UPSTREAM_DIR/AKEData" sparse-checkout set \
            TableCfg \
            output/CN/weapon output/CN/equip
          git -C "$UPSTREAM_DIR/AKEData" checkout

          # Clone public AKEDatabase (no auth needed)
          git clone --depth 1 --filter=blob:none --sparse --no-checkout \
            https://github.com/NagiYume/AKEDatabase.git "$UPSTREAM_DIR/AKEDatabase"
          git -C "$UPSTREAM_DIR/AKEDatabase" sparse-checkout init --cone
          git -C "$UPSTREAM_DIR/AKEDatabase" sparse-checkout set \
            public/CH/maps.json public/EN/maps.json \
            public/JP/maps.json public/TC/maps.json
          git -C "$UPSTREAM_DIR/AKEDatabase" checkout

      - name: Check upstream changes
        id: diff
        run: |
          # Run check (exit code 2 = changed, 0 = no change)
          set +e
          npx tsx scripts/sync-game-data.ts --check --skland-probe \
            --akedata "$RUNNER_TEMP/upstream/AKEData" \
            --imagedb "$RUNNER_TEMP/upstream/AKEDatabase"
          exit_code=$?
          set -e
          if [ $exit_code -eq 2 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif [ $exit_code -eq 0 ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "::error::Check script failed with exit code $exit_code"
            exit $exit_code
          fi

      - name: Cleanup upstream clones
        if: always()
        run: rm -rf "$RUNNER_TEMP/upstream"

  sync:
    needs: check
    # always() is required: when force_sync skips the check job, a plain `needs` guard
    # would skip this job too. The check job's own token validation still runs inside it.
    if: ${{ always() && (inputs.force_sync == true || needs.check.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 主仓 checkout 不拉子模块: 这里显式 clone, 因为稍后要在这个工作区里 commit + push。
      # --no-checkout: 导出会全量重写 33 个文件, 不需要先下载 220 MB 旧内容。
      - name: Checkout cep-assets submodule (public/game-i18n)
        env:
          GH_FORK_SYNC_TOKEN: ${{ secrets.GH_FORK_SYNC_TOKEN }}
        run: |
          git clone --filter=blob:none --no-checkout \
            "https://oauth2:${GH_FORK_SYNC_TOKEN}@github.com/cmyyx/cep-assets.git" public/game-i18n

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate AKEData access token
        env:
          GH_TOKEN: ${{ secrets.GH_FORK_SYNC_TOKEN }}
        run: |
          RESULT=$(gh api /repos/cmyyx/AKEData --jq .private 2>/dev/null) || true
          if [ "$RESULT" != "true" ]; then
            echo "::error::Cannot access private AKEData fork. GH_FORK_SYNC_TOKEN may be invalid or expired. Sync pipeline cannot produce verified data."
            exit 1
          fi

      - name: Sync AKEData fork from upstream
        env:
          GH_TOKEN: ${{ secrets.GH_FORK_SYNC_TOKEN }}
        run: |
          gh api --method POST /repos/cmyyx/AKEData/merge-upstream \
            -f branch='main'

      - name: Clone upstream repos (outside working tree)
        env:
          GH_FORK_SYNC_TOKEN: ${{ secrets.GH_FORK_SYNC_TOKEN }}
        run: |
          UPSTREAM_DIR="$RUNNER_TEMP/upstream"
          mkdir -p "$UPSTREAM_DIR"

          # Clone AKEData fork (synced from upstream above)
          git clone --depth 1 --filter=blob:none --sparse --no-checkout \
            "https://oauth2:${GH_FORK_SYNC_TOKEN}@github.com/cmyyx/AKEData.git" "$UPSTREAM_DIR/AKEData"
          git -C "$UPSTREAM_DIR/AKEData" sparse-checkout init --cone
          git -C "$UPSTREAM_DIR/AKEData" sparse-checkout set \
            TableCfg \
            output/CN/weapon output/CN/equip
          git -C "$UPSTREAM_DIR/AKEData" checkout

          # Clone public AKEDatabase (no auth needed)
          git clone --depth 1 --filter=blob:none --sparse --no-checkout \
            https://github.com/NagiYume/AKEDatabase.git "$UPSTREAM_DIR/AKEDatabase"
          git -C "$UPSTREAM_DIR/AKEDatabase" sparse-checkout init --cone
          git -C "$UPSTREAM_DIR/AKEDatabase" sparse-checkout set \
            public/CH/maps.json public/EN/maps.json \
            public/JP/maps.json public/TC/maps.json
          git -C "$UPSTREAM_DIR/AKEDatabase" checkout

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run sync update
        id: sync
        run: |
          npx tsx scripts/sync-game-data.ts --update --force \
            --akedata "$RUNNER_TEMP/upstream/AKEData" \
            --imagedb "$RUNNER_TEMP/upstream/AKEDatabase"

      - name: Cleanup upstream clones
        if: always()
        run: rm -rf "$RUNNER_TEMP/upstream"

      - name: Commit game-i18n export to cep-assets
        env:
          GH_FORK_SYNC_TOKEN: ${{ secrets.GH_FORK_SYNC_TOKEN }}
        run: |
          cd public/game-i18n
          if [ ! -e .git ]; then
            echo "::error::public/game-i18n/.git 丢失 —— 导出把子模块工作区覆盖了 (export-game-i18n 保留 .git 的逻辑回归)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "cep-assets: 无变化"
          else
            git commit -m "chore: sync game i18n export (${GITHUB_SHA:0:7})"
            git push origin HEAD:main
          fi
          cd "$GITHUB_WORKSPACE"
          # 把子仓新提交写成主仓的子模块指针 (随 PR 一起提交)
          git add public/game-i18n

      - name: Verify submodule wiring
        run: |
          # 历史上上游 sparse clone 会把 .gitmodules 带进工作区; 现在仓库有一个合法子模块
          # (public/game-i18n -> cmyyx/cep-assets), 所以校验"子模块列表恰好等于预期",
          # 并确认主仓 index 里记的是子仓当前提交 (即前面那一步真的 git add 了指针)。
          if [ ! -f .gitmodules ]; then
            echo "::error::.gitmodules 缺失 —— public/game-i18n 应为 cep-assets 子模块"
            exit 1
          fi
          actual=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | sort)
          if [ "$actual" != "public/game-i18n" ]; then
            echo "::error::子模块列表与预期不符:"
            printf '%s\n' "$actual"
            exit 1
          fi
          # git ls-files -s 的格式: <mode> <object> <stage>\t<path>
          entry=$(git ls-files -s public/game-i18n)
          mode=$(printf '%s\n' "$entry" | awk '{print $1}')
          pointer=$(printf '%s\n' "$entry" | awk '{print $2}')
          if [ "$mode" != "160000" ]; then
            echo "::error::public/game-i18n 不是子模块指针 (mode=$mode)"
            exit 1
          fi
          sub_head=$(git -C public/game-i18n rev-parse HEAD)
          if [ "$pointer" != "$sub_head" ]; then
            echo "::error::子模块指针 ($pointer) 与 cep-assets HEAD ($sub_head) 不一致 —— 漏了 git add public/game-i18n"
            exit 1
          fi
          echo "Submodule check passed — public/game-i18n -> ${pointer} (cep-assets)."

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: 'chore: sync game data from upstream'
          # PR back into the branch this run was triggered on (schedule → default
          # branch, workflow_dispatch → the branch you picked). One PR branch per
          # base keeps parallel syncs from force-updating each other's PR.
          base: ${{ github.ref_name }}
          branch: auto/sync-game-data-${{ github.ref_name }}
          commit-message: 'chore: sync game data from upstream'
          body: |
            Automated sync from:
            - AKEData (output/CN/weapon, output/CN/equip, TableCfg/)
            - AKEDatabase (maps.json locales); icons from https://data.akedata.wiki

            Generated files:
            - `src/generated/i18n/weapons/`
            - `src/generated/i18n/equips/`
            - `src/generated/i18n/dungeons/`
            - `src/generated/i18n/stats/`
            - `src/generated/i18n/regions/`
            - `cep-assets` 子模块指针（`public/game-i18n` 游戏文案导出，内容已推送到 cmyyx/cep-assets）
            ${{ steps.sync.outputs.character_scrape_skipped == 'true' && format('⚠️ 头像未刷新：Skland 角色头像抓取被跳过（{0}），已有头像保留不变，需手动补刷。', steps.sync.outputs.character_scrape_reason) || '' }}
