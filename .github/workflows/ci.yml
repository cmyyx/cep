name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gate
    # 固定 24.04 而不是 ubuntu-latest：runner 镜像已切到 26.04，而 Playwright 1.60
    # 不支持 ubuntu26.04-x64（`playwright install --with-deps` 直接报
    # "Playwright does not support chromium on ubuntu26.04-x64" 并中止整个 job）。
    # Playwright 支持 26.04 后再改回 latest。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # public/game-i18n 是 cmyyx/cep-assets 子模块 (公开仓)，构建与 e2e 都需要
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Generate version data
        run: node scripts/generate-version.mjs

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: i18n key check
        run: pnpm run check:i18n

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: true
